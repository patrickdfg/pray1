   if(draft.initialTitle?.trim()&&draft.initialContent?.trim())await room.collection("prayers").add({title:draft.initialTitle.trim(),content:draft.initialContent.trim(),startDate:draft.startDate||"",endDate:draft.endDate||"",createdAt:stamp(),updatedAt:stamp(),createdBy:me});
   setModal(null);setSection("rooms");flash("기도방이 만들어졌어요. 비밀번호를 팀원에게 알려주세요.");}catch(er){flash(labelError(er));}finally{setBusy(false);}
 }
 async function joinRoom(e){e.preventDefault();setBusy(true);try{await db.collection("rooms").doc(draft.roomId).collection("members").doc(me).set({uid:me,displayName:user.displayName||user.email||"기도팀원",accessCode:draft.code,joinedAt:stamp()});setMembers(m=>({...m,[draft.roomId]:true}));setModal(null);flash("기도팀에 가입했어요!");}catch(er){flash(er.code==="permission-denied"?"기도방 비밀번호가 올바르지 않거나 가입할 수 없습니다.":labelError(er));}finally{setBusy(false);}}
 async function leaveRoom(roomId){if(!window.confirm("이 기도팀에서 탈퇴할까요?"))return;try{await db.collection("rooms").doc(roomId).collection("members").doc(me).delete();setMembers(m=>({...m,[roomId]:false}));flash("기도팀에서 탈퇴했어요.");}catch(e){flash(labelError(e));}}
 async function kick(roomId,uid){if(!window.confirm("이 팀원을 기도방에서 해지할까요?"))return;try{await db.collection("rooms").doc(roomId).collection("members").doc(uid).delete();flash("팀원 가입을 해지했어요.");}catch(e){flash(labelError(e));}}
 async function closeRoom(room){const others=ownerMembers[room.id];if(!others){setShowMemberRoom(room.id);flash("먼저 팀원 관리를 열어 회원을 확인해 주세요.");return;}if(others.length){flash("기도방을 없애려면 먼저 모든 팀원을 해지해야 합니다.");return;}if(!window.confirm("이 기도방을 종료할까요? 등록한 팀 기도제목은 더 이상 표시되지 않습니다."))return;try{await db.collection("rooms").doc(room.id).update({archived:true,archivedAt:stamp()});flash("기도방을 종료했어요.");}catch(e){flash(labelError(e));}}
 function Card({p}){const canEdit=p.kind!=="church"||admin;return <article className="prayer-card"><div className="card-top"><span className={"tag "+(p.kind==="team"?"team":p.kind==="personal"?"personal":"")}>{p.kind==="church"?"⛪ 교회 기도":p.kind==="team"?"🤝 팀 기도":"🌷 개인 기도"}</span><span className="date">{p.startDate?fmt(p.startDate):"상시"}{p.endDate?" ~ "+fmt(p.endDate):""}</span></div><h3>{p.title||"제목 없음"}</h3><p>{p.content||""}</p><div className="card-foot"><span className="room-name">{p.kind==="team"?p.roomName:p.kind==="church"?"우리 교회":"나만의 기도"}</span><div className="card-actions">{canEdit&&<><button className="tiny-btn" onClick={()=>openPrayer(p.kind,p.roomId,p)}>수정</button><button className="tiny-btn" onClick={()=>deletePrayer(p)}>삭제</button></>}</div></div></article>}
 if(user===undefined)return <div className="loading"><div>🌿<p>기도의 숲을 준비하고 있어요…</p></div></div>;
 if(!user)return <div className="signin"><div className="signin-card"><div className="brand"><span className="brand-mark">✳</span> 기도의 숲</div><div className="signin-garden">🌳</div><span className="eyebrow" style={{color:"#648b70"}}>A PLACE FOR PRAYER</span><h1>오늘도 함께 기도해요</h1><p>교회의 기도, 우리 팀의 기도, 나만의 기도까지.<br/>한 공간에 모아 마음을 잇는 기도의 숲입니다.</p><button className="primary" onClick={doLogin} disabled={busy}>{busy?"로그인 중…":"G  Google 계정으로 시작하기"}</button><div className="signin-foot">Google 로그인 후 실제 기도제목이 안전하게 저장됩니다.<br/>체험용 가상 데이터는 사용하지 않습니다.</div></div>{toast&&<div className="toast">{toast}</div>}</div>;
 return <><header className="shell topbar"><div className="brand"><span className="brand-mark">✳</span> 기도의 숲</div><div className="top-actions"><div className="user-pill">{user.photoURL?<img className="avatar" src={user.photoURL} alt="프로필"/>:<div className="avatar">🌿</div>}<span>{user.displayName||user.email}{admin?" · 관리자":""}</span></div><button className="text-btn" onClick={()=>auth.signOut()}>로그아웃</button></div></header>
 <div className="shell"><section className="hero"><div className="hero-content"><small>MY DAILY PRAYER GARDEN</small><h1>오늘도 기도의 씨앗을<br/>심어볼까요?</h1><p>작은 기도가 모여 큰 숲을 이룹니다.<br/>우리의 소중한 기도제목을 함께 품어요.</p><div className="hero-buttons"><button className="primary light" onClick={focusNow}>🙏 지금 기도하기 →</button><button className="primary" style={{background:"#ffffff25",boxShadow:"none",border:"1px solid #ffffff55"}} onClick={()=>openPrayer("personal")}>＋ 나의 기도 추가</button></div></div><div className="hero-art" aria-hidden="true"><svg viewBox="0 0 420 300" xmlns="http://www.w3.org/2000/svg"><circle cx="294" cy="72" r="45" fill="#ffdb98"/><path d="M0 260Q70 185 130 245Q190 190 238 245Q320 182 420 235V300H0Z" fill="#39735b"/><path d="M0 278Q80 218 150 265Q244 200 325 260Q383 236 420 260V300H0Z" fill="#81a98b"/><rect x="299" y="120" width="14" height="172" rx="6" fill="#f0dcb5"/><ellipse cx="302" cy="119" rx="72" ry="82" fill="#b8d4a2"/><ellipse cx="344" cy="139" rx="58" ry="62" fill="#d3dea8"/><ellipse cx="263" cy="150" rx="51" ry="56" fill="#96be91"/><path d="M85 280q20-48 42 0M115 285q30-82 55 0" fill="none" stroke="#d7e6bd" strokeWidth="10" strokeLinecap="round"/><circle cx="93" cy="213" r="9" fill="#ffdd9c"/><circle cx="173" cy="235" r="6" fill="#ffdd9c"/></svg></div></section>
 <div className="main-layout"><aside className="sidebar"><div className="side-title">PRAYER MENU</div>{[["all","🏡","나의 기도"],["church","⛪","교회 기도"],["team","🤝","팀 기도"],["personal","🌷","개인 기도"],["rooms","🌲","기도방"]].map(([id,ico,label])=><button key={id} className={"nav "+(section===id?"active":"")} onClick={()=>{setSection(id);setFilter("all");}}><span className="ico">{ico}</span>{label}</button>)}<div className="sideline"></div><div className="side-note"><strong>🌱 오늘의 작은 실천</strong>하나의 기도제목이라도 마음을 담아 기도해 보세요.</div></aside>
 <main>{section!=="rooms"?<><div className="section-head"><div><h2>{section==="all"?"나의 기도 모아보기":section==="church"?"교회 기도제목":section==="team"?"기도팀과 함께": "개인 기도제목"}</h2><p>{section==="all"?"교회, 팀, 개인 기도를 한눈에 확인해요.":section==="church"?"교회가 함께 품는 기도제목입니다.":section==="team"?"내가 속한 모든 기도팀의 기도제목입니다.":"나만의 기도제목을 기록하고 돌아보세요."}</p></div><div className="section-buttons">{(section==="personal"||section==="all")&&<button className="outline" onClick={()=>openPrayer("personal")}>＋ 개인 기도</button>}{section==="church"&&admin&&<button className="primary" onClick={()=>openPrayer("church")}>＋ 교회 기도</button>}{section==="team"&&joined.length>0&&<button className="primary" onClick={()=>openPrayer("team")}>＋ 팀 기도</button>}</div></div>
 {section==="all"&&<div className="stats"><div className="stat"><span className="mini">⛪</span><strong>{church.length}</strong><p>교회 기도제목</p></div><div className="stat"><span className="mini">🤝</span><strong>{allTeam.length}</strong><p>함께하는 팀 기도</p></div><div className="stat"><span className="mini">🌷</span><strong>{personal.length}</strong><p>나의 개인 기도</p></div></div>}
 {section==="all"&&<div className="tabs">{[["all","전체 "+all.length],["church","교회"],["team","기도팀"],["personal","개인"]].map(([id,label])=><button key={id} className={"chip "+(filter===id?"active":"")} onClick={()=>setFilter(id)}>{label}</button>)}</div>}
 {section==="team"&&<div className="tabs">{joined.length?joined.map(r=><button className="chip" key={r.id} onClick={()=>openPrayer("team",r.id)}>＋ {r.name} 기도 작성</button>):<button className="chip" onClick={()=>setSection("rooms")}>기도방 참가하기 →</button>}</div>}
 <div className="cards">{shown.length?shown.map(p=><Card key={p.kind+":"+p.roomId+":"+p.id} p={p}/>):<div className="empty"><div className="plant">🌱</div><h3>아직 심어진 기도제목이 없어요</h3><p>{section==="church"&&!admin?"교회 관리자가 기도제목을 등록하면 이곳에 표시됩니다.":section==="team"?"기도방에 참가하거나 팀 기도를 등록해 보세요.":"첫 번째 기도제목을 작성해 보세요."}</p>{section==="team"?<button className="primary" onClick={()=>setSection("rooms")}>기도방 살펴보기</button>:(section==="all"||section==="personal")?<button className="primary" onClick={()=>openPrayer("personal")}>＋ 기도제목 등록</button>:admin?<button className="primary" onClick={()=>openPrayer("church")}>＋ 교회 기도 등록</button>:null}</div>}</div>
 </>:<><div className="section-head"><div><h2>기도방</h2><p>함께 기도할 팀을 만들고, 비밀번호로 참가할 수 있어요.</p></div><button className="primary" onClick={openRoom}>＋ 기도방 만들기</button></div>{rooms.length===0?<div className="empty"><div className="plant">🌳</div><h3>첫 번째 기도방을 만들어 보세요</h3><p>기도방 이름과 기간, 비밀번호를 정하고 팀원들과 기도제목을 나눠요.</p><button className="primary" onClick={openRoom}>기도방 만들기</button></div>:<div className="room-cards">{rooms.map(r=>{const owner=r.ownerId===me,inside=owner||members[r.id];return <article className="room-card" key={r.id}><div className="room-icon">🌿</div><h3>{r.name}</h3><p>{r.startDate||r.endDate?"기도 기간 : "+(fmt(r.startDate)||"시작일 미정")+" ~ "+(fmt(r.endDate)||"종료일 미정"):"기간 제한 없는 기도방"}<br/>팀장 : {r.ownerName||"기도팀장"}</p><div className="room-row"><span className={"room-badge "+(inside?"":"lock")}>{owner?"👑 내가 만든 방":inside?"✓ 참가 중":"🔒 비밀번호 필요"}</span>{!inside?<button className="primary" onClick={()=>openJoin(r)}>기도방 참가하기</button>:<button className="outline" onClick={()=>{setSection("team");openPrayer("team",r.id);}}>＋ 팀 기도 작성</button>}{inside&&!owner&&<button className="tiny-btn" onClick={()=>leaveRoom(r.id)}>탈퇴</button>}{owner&&<button className="tiny-btn" onClick={()=>setShowMemberRoom(showMemberRoom===r.id?"":r.id)}>팀원 관리</button>}</div>{owner&&showMemberRoom===r.id&&<div className="members"><strong style={{fontSize:12}}>팀원 목록 ({(ownerMembers[r.id]||[]).length}명)</strong>{(ownerMembers[r.id]||[]).map(m=><div className="member" key={m.id}><span>{m.displayName||"팀원"}</span><button className="tiny-btn" onClick={()=>kick(r.id,m.id)}>가입 해지</button></div>)}{!(ownerMembers[r.id]||[]).length&&<p>가입한 팀원이 없습니다.</p>}<button className="outline danger" style={{marginTop:10,fontSize:12}} onClick={()=>closeRoom(r)}>기도방 종료</button></div>}</article>;})}</div>}<div className="notice">🔐 기도방 비밀번호는 8자 이상으로 설정해 주세요. 비밀번호를 아는 사람도 Google 로그인 후 참가해야 합니다.</div></>}
 </main></div></div>
 {modal&&<div className="modal-bg" onMouseDown={e=>{if(e.target===e.currentTarget&&!busy)setModal(null);}}><div className="modal"><div className="modal-head"><h2>{modal==="room"?"🌳 기도방 만들기":modal==="join"?"🔒 기도방 참가하기":draft.id?"✏️ 기도제목 수정":"🌱 기도제목 등록"}</h2><button className="x" onClick={()=>setModal(null)} aria-label="닫기">×</button></div>
 {modal==="prayer"?<form onSubmit={savePrayer}><div className="field"><label>기도 종류</label><select value={draft.kind||"personal"} disabled={!!draft.id} onChange={e=>setDraft(d=>({...d,kind:e.target.value,roomId:joined[0]?.id||""}))}><option value="personal">🌷 개인 기도</option>{joined.length>0&&<option value="team">🤝 팀 기도</option>}{admin&&<option value="church">⛪ 교회 기도</option>}</select></div>{draft.kind==="team"&&<div className="field"><label>기도팀 선택</label><select value={draft.roomId||""} disabled={!!draft.id} required onChange={e=>setDraft(d=>({...d,roomId:e.target.value}))}>{joined.map(r=><option key={r.id} value={r.id}>{r.name}</option>)}</select></div>}
 <div className="field"><label>기도명 *</label><input required maxLength="100" placeholder="예: 가정의 평안과 건강" value={draft.title||""} onChange={e=>setDraft(d=>({...d,title:e.target.value}))}/></div>
 <div className="field-row"><div className="field"><label>시작일</label><input type="date" value={draft.startDate||""} onChange={e=>setDraft(d=>({...d,startDate:e.target.value}))}/></div><div className="field"><label>종료일</label><input type="date" value={draft.endDate||""} onChange={e=>setDraft(d=>({...d,endDate:e.target.value}))}/></div></div>
 <div className="field"><label>기도제목 *</label><textarea required maxLength="5000" placeholder="기도할 내용을 편안하게 적어주세요." value={draft.content||""} onChange={e=>setDraft(d=>({...d,content:e.target.value}))}/></div><div className="modal-actions"><button type="button" className="outline" onClick={()=>setModal(null)}>취소</button><button className="primary" disabled={busy}>{busy?"저장 중…":"저장하기"}</button></div></form>
 :modal==="room"?<form onSubmit={createRoom}><div className="field"><label>기도방 이름 *</label><input required maxLength="80" placeholder="예: 절대 믿음 40일 기도팀" value={draft.name||""} onChange={e=>setDraft(d=>({...d,name:e.target.value}))}/></div><div className="field-row"><div className="field"><label>기도 시작일</label><input type="date" value={draft.startDate||""} onChange={e=>setDraft(d=>({...d,startDate:e.target.value}))}/></div><div className="field"><label>기도 종료일</label><input type="date" value={draft.endDate||""} onChange={e=>setDraft(d=>({...d,endDate:e.target.value}))}/></div></div><div className="field"><label>참가 비밀번호 * (8자 이상)</label><input required minLength="8" maxLength="64" autoComplete="off" type="password" placeholder="팀원에게 전달할 비밀번호" value={draft.code||""} onChange={e=>setDraft(d=>({...d,code:e.target.value}))}/><span className="form-help">참가 비밀번호는 기도방 공개 목록에 표시되지 않습니다.</span></div><div className="field"><label>첫 번째 기도명 (선택)</label><input maxLength="100" placeholder="예: 우리 팀의 기도제목" value={draft.initialTitle||""} onChange={e=>setDraft(d=>({...d,initialTitle:e.target.value}))}/></div><div className="field"><label>첫 번째 기도제목 (선택)</label><textarea placeholder="첫 기도제목을 함께 등록할 수 있어요." value={draft.initialContent||""} onChange={e=>setDraft(d=>({...d,initialContent:e.target.value}))}/></div><div className="modal-actions"><button className="outline" type="button" onClick={()=>setModal(null)}>취소</button><button className="primary" disabled={busy}>{busy?"만드는 중…":"기도방 만들기"}</button></div></form>
 :<form onSubmit={joinRoom}><p style={{fontSize:14,color:"#687b6d",lineHeight:1.8}}><strong>{draft.roomName}</strong>에 참가하시려면 팀장이 알려준 비밀번호를 입력하세요.</p><div className="field"><label>기도방 비밀번호</label><input required type="password" autoComplete="off" placeholder="참가 비밀번호 입력" value={draft.code||""} onChange={e=>setDraft(d=>({...d,code:e.target.value}))}/></div><div className="modal-actions"><button type="button" className="outline" onClick={()=>setModal(null)}>취소</button><button className="primary" disabled={busy}>{busy?"확인 중…":"기도방 참가하기"}</button></div></form>}</div></div>}
 {focus>=0&&all.length>0&&<div className="focus-screen"><div className="focus-head"><strong>🌿 기도의 시간</strong><button className="primary light" onClick={()=>setFocus(-1)}>✕ 마치기</button></div><div className="focus-center"><div className="circle">🙏</div><span className="counter">{focus+1} / {all.length}</span><h2>{all[Math.min(focus,all.length-1)].title}</h2><span className="tag">{all[Math.min(focus,all.length-1)].kind==="church"?"교회 기도":all[Math.min(focus,all.length-1)].kind==="team"?"팀 기도":"개인 기도"}</span><p>{all[Math.min(focus,all.length-1)].content}</p><div className="focus-controls"><button className="outline" disabled={focus===0} onClick={()=>setFocus(i=>Math.max(0,i-1))}>← 이전 제목</button><button className="primary light" disabled={focus>=all.length-1} onClick={()=>setFocus(i=>Math.min(all.length-1,i+1))}>다음 제목 →</button></div></div><div className="focus-bottom">잠시 멈추어 기도의 내용에 마음을 모아보세요.</div></div>}
 {toast&&<div className="toast" role="status">{toast}</div>}</>;
}
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body></html>
