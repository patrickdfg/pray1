<!DOCTYPE html>
<html lang="ko" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>기도의 자리 - 연합 기도 공간</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <!-- Babel -->
    <script crossorigin src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Google Identity Services for Google Login -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Pretendard', sans-serif; }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-in { animation: fadeIn 0.3s ease-out forwards; }
    </style>
</head>
<body class="h-full bg-slate-50 text-slate-800">
    <div id="root" class="h-full"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        function App() {
            // 사용자 및 인증 상태
            const [user, setUser] = useState(null); // { email, name }
            const [isAdmin, setIsAdmin] = useState(false);

            // 화면 전환 상태 ('home', 'room-list', 'create-room', 'room-view', 'focus-mode')
            const [view, setView] = useState('home');

            // 방 목록 및 현재 방 상태
            const [rooms, setRooms] = useState([]);
            const [currentRoom, setCurrentRoom] = useState(null);
            
            // 모달 및 입력 상태 (방 만들기)
            const [newRoomName, setNewRoomName] = useState('');
            const [newRoomPassword, setNewRoomPassword] = useState('');
            const [joinPasswordInput, setJoinPasswordInput] = useState('');
            const [selectedRoomToJoin, setSelectedRoomToJoin] = useState(null);

            // 기도제목 데이터 상태 (현재 방 내부)
            const [churchPrayers, setChurchPrayers] = useState([]); // 교회 기도 (관리자만 작성)
            const [teamPrayers, setTeamPrayers] = useState([]);     // 팀 기도
            const [personalPrayers, setPersonalPrayers] = useState([]);// 개인 기도

            // 기도 작성 폼 상태 (기도이름, 기간, 기도제목)
            const [prayerModalOpen, setPrayerModalOpen] = useState(false);
            const [prayerCategory, setPrayerCategory] = useState('church'); // 'church', 'team', 'personal'
            const [prayerName, setPrayerName] = useState('');
            const [prayerPeriod, setPrayerPeriod] = useState('');
            const [prayerContent, setPrayerContent] = useState('');
            const [editPrayerId, setEditPrayerId] = useState(null);

            // 집중기도 모드 인덱스
            const [focusIndex, setFocusIndex] = useState(0);

            // 토스트 알림
            const [toast, setToast] = useState('');
            const showToast = (msg) => {
                setToast(msg);
                setTimeout(() => setToast(''), 3000);
            };

            // 초기 로컬 스토리지 데이터 로드 (방 목록)
            useEffect(() => {
                const savedRooms = localStorage.getItem('prayer_all_rooms');
                if (savedRooms) {
                    setRooms(JSON.parse(savedRooms));
                } else {
                    // 기본 샘플 방
                    const defaultRooms = [
                        { id: 'room-1', name: '사랑의교회 중보기도팀', password: '1234', host: 'egibynote105g@gmail.com' }
                    ];
                    setRooms(defaultRooms);
                    localStorage.setItem('prayer_all_rooms', JSON.stringify(defaultRooms));
                }
            }, []);

            // 구글 로그인 초기화 및 핸들러
            useEffect(() => {
                // 테스트나 개발 환경을 위한 수동 로그인 버튼도 겸용 제공
                window.handleCredentialResponse = (response) => {
                    try {
                        const payload = JSON.parse(atob(response.credential.split('.')[1]));
                        const email = payload.email;
                        const name = payload.name;
                        setUser({ email, name });
                        if (email === 'egibynote105g@gmail.com') {
                            setIsAdmin(true);
                            showToast('관리자(egibynote105g@gmail.com) 계정으로 로그인되었습니다.');
                        } else {
                            setIsAdmin(false);
                            showToast(`${name}님 환영합니다!`);
                        }
                    } catch (e) {
                        showToast('로그인 처리 중 오류가 발생했습니다.');
                    }
                };

                if (window.google) {
                    try {
                        window.google.accounts.id.initialize({
                            client_id: "YOUR_GOOGLE_CLIENT_ID.apps.googleusercontent.com", // 필요시 실제 클라이언트 ID 입력
                            callback: window.handleCredentialResponse
                        });
                    } catch (e) {}
                }
            }, []);

            // 간편 테스트용 강제 관리자/일반 로그인 버튼 (OAuth 미설정 환경 대비)
            const handleManualLogin = (asAdmin = false) => {
                if (asAdmin) {
                    setUser({ email: 'egibynote105g@gmail.com', name: '교회 관리자' });
                    setIsAdmin(true);
                    showToast('관리자 계정으로 로그인되었습니다.');
                } else {
                    setUser({ email: 'user@gmail.com', name: '일반 성도' });
                    setIsAdmin(false);
                    showToast('성도 계정으로 로그인되었습니다.');
                }
            };

            const handleLogout = () => {
                setUser(null);
                setIsAdmin(false);
                setView('home');
                setCurrentRoom(null);
                showToast('로그아웃되었습니다.');
            };

            // 방 데이터 동기화
            useEffect(() => {
                if (!currentRoom) return;
                const rId = currentRoom.id;
                const savedChurch = localStorage.getItem(`room_${rId}_church`);
                const savedTeam = localStorage.getItem(`room_${rId}_team`);
                const savedPersonal = localStorage.getItem(`room_${rId}_personal_${user?.email || 'guest'}`);

                if (savedChurch) setChurchPrayers(JSON.parse(savedChurch));
                else {
                    const initialChurch = [{ id: 'c1', name: '성전 건축과 부흥', period: '2026년 상반기', content: '모든 공정이 은혜 가운데 마무리되게 하소서.', answered: false, author: '관리자' }];
                    setChurchPrayers(initialChurch);
                    localStorage.setItem(`room_${rId}_church`, JSON.stringify(initialChurch));
                }

                if (savedTeam) setTeamPrayers(JSON.parse(savedTeam));
                else setTeamPrayers([]);

                if (savedPersonal) setPersonalPrayers(JSON.parse(savedPersonal));
                else setPersonalPrayers([]);
            }, [currentRoom, user]);

            // 방 데이터 저장
            useEffect(() => {
                if (!currentRoom) return;
                localStorage.setItem(`room_${currentRoom.id}_church`, JSON.stringify(churchPrayers));
            }, [churchPrayers, currentRoom]);

            useEffect(() => {
                if (!currentRoom) return;
                localStorage.setItem(`room_${currentRoom.id}_team`, JSON.stringify(teamPrayers));
            }, [teamPrayers, currentRoom]);

            useEffect(() => {
                if (!currentRoom || !user) return;
                localStorage.setItem(`room_${currentRoom.id}_personal_${user.email}`, JSON.stringify(personalPrayers));
            }, [personalPrayers, currentRoom, user]);

            // 방 만들기 제출
            const handleCreateRoomSubmit = (e) => {
                e.preventDefault();
                if (!newRoomName.trim()) {
                    showToast('방 이름을 입력해주세요.');
                    return;
                }
                const newRoom = {
                    id: 'room-' + Date.now(),
                    name: newRoomName.trim(),
                    password: newRoomPassword.trim(),
                    host: user?.email || 'unknown'
                };
                const updatedRooms = [...rooms, newRoom];
                setRooms(updatedRooms);
                localStorage.setItem('prayer_all_rooms', JSON.stringify(updatedRooms));
                
                setNewRoomName('');
                setNewRoomPassword('');
                setCurrentRoom(newRoom);
                setView('room-view');
                showToast(`'${newRoom.name}' 방이 생성되었습니다.`);
            };

            // 방 참여 비밀번호 확인
            const handleJoinRoomAttempt = (e) => {
                e.preventDefault();
                if (!selectedRoomToJoin) return;
                if (selectedRoomToJoin.password && selectedRoomToJoin.password !== joinPasswordInput) {
                    showToast('비밀번호가 일치하지 않습니다.');
                    return;
                }
                setCurrentRoom(selectedRoomToJoin);
                setSelectedRoomToJoin(null);
                setJoinPasswordInput('');
                setView('room-view');
                showToast(`'${selectedRoomToJoin.name}'에 입장했습니다.`);
            };

            // 기도제목 저장
            const handleSavePrayer = (e) => {
                e.preventDefault();
                if (!prayerName.trim()) {
                    showToast('기도 제목 이름을 입력해주세요.');
                    return;
                }

                const newItem = {
                    id: editPrayerId || Date.now().toString(),
                    name: prayerName,
                    period: periodFormatted(prayerPeriod),
                    content: prayerContent,
                    answered: false,
                    author: user?.name || '성도'
                };

                if (prayerCategory === 'church') {
                    if (!isAdmin) {
                        showToast('교회 기도제목은 관리자(egibynote105g@gmail.com)만 작성할 수 있습니다.');
                        return;
                    }
                    if (editPrayerId) setChurchPrayers(churchPrayers.map(p => p.id === editPrayerId ? {...newItem, answered: p.answered} : p));
                    else setChurchPrayers([newItem, ...churchPrayers]);
                } else if (prayerCategory === 'team') {
                    if (editPrayerId) setTeamPrayers(teamPrayers.map(p => p.id === editPrayerId ? {...newItem, answered: p.answered} : p));
                    else setTeamPrayers([newItem, ...teamPrayers]);
                } else {
                    if (editPrayerId) setPersonalPrayers(personalPrayers.map(p => p.id === editPrayerId ? {...newItem, answered: p.answered} : p));
                    else setPersonalPrayers([newItem, ...personalPrayers]);
                }

                showToast('기도제목이 안전하게 저장되었습니다.');
                setPrayerModalOpen(false);
                resetPrayerForm();
            };

            const periodFormatted = (val) => val.trim() || '상시기도';

            const resetPrayerForm = () => {
                setPrayerName('');
                setPrayerPeriod('');
                setPrayerContent('');
                setEditPrayerId(null);
            };

            // 삭제 및 응답 토글
            const handleDeletePrayer = (cat, id) => {
                if (cat === 'church' && !isAdmin) {
                    showToast('권한이 없습니다.');
                    return;
                }
                if (!window.confirm('정말 삭제하시겠습니까?')) return;
                if (cat === 'church') setChurchPrayers(churchPrayers.filter(p => p.id !== id));
                else if (cat === 'team') setTeamPrayers(teamPrayers.filter(p => p.id !== id));
                else setPersonalPrayers(personalPrayers.filter(p => p.id !== id));
                showToast('삭제되었습니다.');
            };

            const handleToggleAnswer = (cat, id) => {
                if (cat === 'church') {
                    setChurchPrayers(churchPrayers.map(p => p.id === id ? { ...p, answered: !p.answered } : p));
                } else if (cat === 'team') {
                    setTeamPrayers(teamPrayers.map(p => p.id === id ? { ...p, answered: !p.answered } : p));
                } else {
                    setPersonalPrayers(personalPrayers.map(p => p.id === id ? { ...p, answered: !p.answered } : p));
                }
            };

            // 로그인 안된 경우 로그인 화면 (메인)
            if (!user) {
                return (
                    <div className="min-h-full flex items-center justify-center p-4 bg-gradient-to-br from-emerald-50 via-teal-50 to-cyan-100">
                        <div className="max-w-md w-full bg-white rounded-3xl shadow-xl p-8 border border-emerald-100 animate-fade-in text-center">
                            <div className="inline-flex items-center justify-center w-20 h-20 bg-emerald-100 text-emerald-600 rounded-full mb-4 shadow-inner text-3xl">
                                🙏
                            </div>
                            <h1 className="text-2xl font-bold text-slate-800">기도의 자리</h1>
                            <p className="text-sm text-slate-500 mt-1 mb-8">교회, 팀, 개인의 기도제목을 나누고 연합하는 공간</p>

                            <div className="space-y-3">
                                <div className="p-3 bg-slate-50 rounded-2xl border border-slate-200 text-xs text-slate-600 mb-4">
                                    관리자 계정(<span className="font-bold text-emerald-600">egibynote105g@gmail.com</span>)으로 로그인 시 <strong>교회 공용 기도제목</strong> 작성 권한이 부여됩니다.
                                </div>

                                <button 
                                    onClick={() => handleManualLogin(true)}
                                    className="w-full py-3.5 bg-emerald-600 hover:bg-emerald-700 text-white font-semibold rounded-2xl shadow-lg shadow-emerald-600/20 transition flex items-center justify-center space-x-2 text-sm"
                                >
                                    <span>🔑 관리자로 간편 로그인</span>
                                </button>
                                <button 
                                    onClick={() => handleManualLogin(false)}
                                    className="w-full py-3.5 bg-slate-800 hover:bg-slate-900 text-white font-semibold rounded-2xl shadow-lg transition flex items-center justify-center space-x-2 text-sm"
                                >
                                    <span>👤 성도(일반)로 간편 로그인</span>
                                </button>
                            </div>
                        </div>
                    </div>
                );
            }

            // 홈 화면 (첫 페이지: 공통 교회 기도제목 및 방 참여/만들기)
            if (view === 'home') {
                return (
                    <div className="min-h-full flex flex-col bg-slate-50">
                        {toast && (
                            <div className="fixed top-5 left-1/2 transform -translate-x-1/2 z-50 bg-slate-900/90 text-white px-5 py-3 rounded-2xl shadow-2xl text-sm font-medium animate-fade-in backdrop-blur-md">
                                {toast}
                            </div>
                        )}

                        <header className="bg-white border-b border-slate-200 px-6 py-4 flex items-center justify-between sticky top-0 z-20">
                            <div className="flex items-center space-x-3">
                                <div className="w-10 h-10 rounded-xl bg-emerald-100 text-emerald-700 flex items-center justify-center font-bold">
                                    🙏
                                </div>
                                <div>
                                    <h1 className="font-bold text-slate-800">기도의 자리</h1>
                                    <p className="text-xs text-slate-500">
                                        {user.name} ({user.email}) {isAdmin && <span className="text-emerald-600 font-bold">[관리자]</span>}
                                    </p>
                                </div>
                            </div>
                            <button onClick={handleLogout} className="text-xs text-slate-400 hover:text-slate-600 px-3 py-1.5 rounded-lg border border-slate-200">
                                로그아웃
                            </button>
                        </header>

                        <main className="flex-1 max-w-4xl w-full mx-auto p-4 sm:p-6 space-y-6">
                            {/* 방 만들기 / 참여하기 버튼 박스 */}
                            <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                                <button 
                                    onClick={() => setView('create-room')}
                                    className="p-6 bg-emerald-600 hover:bg-emerald-700 text-white rounded-3xl shadow-xl shadow-emerald-600/20 text-left transition flex flex-col justify-between"
                                >
                                    <div>
                                        <span className="text-2xl mb-2 block">✨</span>
                                        <h3 className="text-lg font-bold">새로운 기도방 만들기</h3>
                                        <p className="text-xs text-emerald-100 mt-1">우리 구역이나 소그룹을 위한 방을 개설하세요.</p>
                                    </div>
                                    <span className="mt-4 text-xs font-semibold underline">방 만들기 바로가기 &rarr;</span>
                                </button>

                                <button 
                                    onClick={() => setView('room-list')}
                                    className="p-6 bg-white hover:bg-slate-50 border border-slate-200 text-slate-800 rounded-3xl shadow-sm text-left transition flex flex-col justify-between"
                                >
                                    <div>
                                        <span className="text-2xl mb-2 block">🚪</span>
                                        <h3 className="text-lg font-bold">기도방 참여하기</h3>
                                        <p className="text-xs text-slate-500 mt-1">생성된 기도방 목록을 보고 비밀번호를 입력해 입장하세요.</p>
                                    </div>
                                    <span className="mt-4 text-xs font-semibold text-emerald-600">방 목록 보기 ({rooms.length}개) &rarr;</span>
                                </button>
                            </div>

                            {/* 첫페이지 핵심: 공통 교회 기도제목 */}
                            <div className="bg-white rounded-3xl p-6 sm:p-8 shadow-sm border border-slate-200">
                                <div className="flex items-center justify-between mb-6">
                                    <div>
                                        <span className="px-3 py-1 bg-emerald-100 text-emerald-800 rounded-full text-xs font-bold">공통 안내</span>
                                        <h2 className="text-xl font-bold text-slate-800 mt-2">⛪ 전체 교회 공용 기도제목</h2>
                                        <p className="text-xs text-slate-500 mt-1">교회 전체 성도가 함께 합심하여 기도하는 제목입니다.</p>
                                    </div>
                                    {isAdmin && (
                                        <button 
                                            onClick={() => {
                                                setPrayerCategory('church');
                                                resetPrayerForm();
                                                setPrayerModalOpen(true);
                                            }}
                                            className="px-4 py-2.5 bg-emerald-600 text-white text-xs font-semibold rounded-xl shadow-md hover:bg-emerald-700"
                                        >
                                            + 교회 기도 작성 (관리자 전용)
                                        </button>
                                    )}
                                </div>

                                <div className="space-y-3">
                                    {rooms.length > 0 && (
                                        <div className="text-xs text-slate-400 mb-2">현재 기본 연합방의 공용 기도제목입니다.</div>
                                    )}
                                    <div className="bg-emerald-50/50 rounded-2xl p-5 border border-emerald-100">
                                        <div className="flex items-center justify-between mb-2">
                                            <div className="flex items-center space-x-2">
                                                <span className="px-2 py-0.5 bg-emerald-600 text-white text-[10px] font-bold rounded">상시기도</span>
                                                <h3 className="font-bold text-slate-800">나라와 민족, 그리고 한국교회를 위한 기도</h3>
                                            </div>
                                            <span className="text-xs text-slate-400">작성: 관리자</span>
                                        </div>
                                        <p className="text-sm text-slate-600 leading-relaxed">
                                            모든 성도들이 영육간에 강건하고 세상 속에서 빛과 소금의 사명을 온전히 감당하게 하소서.
                                        </p>
                                    </div>
                                </div>
                            </div>
                        </main>
                    </div>
                );
            }

            // 방 만들기 화면
            if (view === 'create-room') {
                return (
                    <div className="min-h-full flex items-center justify-center p-4 bg-slate-50">
                        <div className="max-md w-full bg-white rounded-3xl shadow-xl p-8 border border-slate-200 animate-fade-in">
                            <button onClick={() => setView('home')} className="text-xs text-slate-400 hover:text-slate-600 mb-4 block">
                                &larr; 홈으로 돌아가기
                            </button>
                            <h2 className="text-xl font-bold text-slate-800 mb-2">✨ 새로운 기도방 만들기</h2>
                            <p className="text-xs text-slate-500 mb-6">팀원들과 공유할 방 이름과 비밀번호를 설정하세요.</p>

                            <form onSubmit={handleCreateRoomSubmit} className="space-y-4">
                                <div>
                                    <label className="block text-xs font-semibold text-slate-600 uppercase mb-1">방 이름</label>
                                    <input 
                                        type="text" 
                                        value={newRoomName}
                                        onChange={(e) => setNewRoomName(e.target.value)}
                                        placeholder="예: 청년부 3셀 기도방"
                                        className="w-full px-4 py-3 rounded-xl border border-slate-200 text-sm focus:ring-2 focus:ring-emerald-500 focus:outline-none"
                                    />
                                </div>
                                <div>
                                    <label className="block text-xs font-semibold text-slate-600 uppercase mb-1">방 비밀번호 (참여용)</label>
                                    <input 
                                        type="password" 
                                        value={newRoomPassword}
                                        onChange={(e) => setNewRoomPassword(e.target.value)}
                                        placeholder="비밀번호 4자리"
                                        className="w-full px-4 py-3 rounded-xl border border-slate-200 text-sm focus:ring-2 focus:ring-emerald-500 focus:outline-none"
                                    />
                                </div>
                                <button 
                                    type="submit"
                                    className="w-full py-3.5 bg-emerald-600 hover:bg-emerald-700 text-white font-semibold rounded-xl text-sm shadow-md"
                                >
                                    방 만들고 입장하기
                                </button>
                            </form>
                        </div>
                    </div>
                );
            }

            // 방 참여하기 화면 (방 목록 표시 후 클릭하여 비밀번호 입력)
            if (view === 'room-list') {
                return (
                    <div className="min-h-full flex flex-col bg-slate-50 p-4 sm:p-8">
                        <div className="max-w-xl w-full mx-auto">
                            <button onClick={() => setView('home')} className="text-xs text-slate-400 hover:text-slate-600 mb-4 block">
                                &larr; 홈으로 돌아가기
                            </button>
                            <h2 className="text-xl font-bold text-slate-800 mb-2">🚪 기도방 참여하기</h2>
                            <p className="text-xs text-slate-500 mb-6">참여할 방을 선택하고 비밀번호를 입력해주세요.</p>

                            {selectedRoomToJoin ? (
                                <div className="bg-white rounded-3xl p-6 shadow-xl border border-emerald-200 animate-fade-in">
                                    <h3 className="font-bold text-slate-800 mb-1">'{selectedRoomToJoin.name}' 입장</h3>
                                    <p className="text-xs text-slate-400 mb-4">방 비밀번호를 입력하세요.</p>
                                    <form onSubmit={handleJoinRoomAttempt} className="space-y-4">
                                        <input 
                                            type="password" 
                                            value={joinPasswordInput}
                                            onChange={(e) => setJoinPasswordInput(e.target.value)}
                                            placeholder="비밀번호"
                                            className="w-full px-4 py-3 rounded-xl border border-slate-200 text-sm focus:ring-2 focus:ring-emerald-500 focus:outline-none"
                                        />
                                        <div className="flex space-x-2">
                                            <button 
                                                type="button" 
                                                onClick={() => setSelectedRoomToJoin(null)}
                                                className="flex-1 py-2.5 bg-slate-100 rounded-xl text-xs font-semibold text-slate-600"
                                            >
                                                취소
                                            </button>
                                            <button 
                                                type="submit" 
                                                className="flex-1 py-2.5 bg-emerald-600 rounded-xl text-xs font-semibold text-white shadow-md"
                                            >
                                                입장하기
                                            </button>
                                        </div>
                                    </form>
                                </div>
                            ) : (
                                <div className="space-y-3">
                                    {rooms.map(room => (
                                        <div 
                                            key={room.id}
                                            onClick={() => setSelectedRoomToJoin(room)}
                                            className="bg-white rounded-2xl p-5 border border-slate-200 shadow-sm hover:border-emerald-400 transition cursor-pointer flex items-center justify-between"
                                        >
                                            <div>
                                                <h3 className="font-bold text-slate-800">{room.name}</h3>
                                                <p className="text-xs text-slate-400 mt-0.5">개설자: {room.host}</p>
                                            </div>
                                            <span className="px-3 py-1.5 bg-emerald-50 text-emerald-700 text-xs font-bold rounded-xl">참여하기 &rarr;</span>
                                        </div>
                                    ))}
                                </div>
                            )}
                        </div>
                    </div>
                );
            }

            // 집중 기도 모드 뷰
            if (view === 'focus-mode') {
                const allPrayers = [...churchPrayers, ...teamPrayers, ...personalPrayers];
                return (
                    <div className="min-h-full flex flex-col bg-slate-900 text-white p-4 sm:p-8 justify-between">
                        <div className="max-w-xl w-full mx-auto flex justify-between items-center py-4">
                            <span className="px-3 py-1 bg-amber-500/20 text-amber-400 rounded-full text-xs font-bold uppercase tracking-wider">
                                온전한 기도의 시간
                            </span>
                            <button onClick={() => setView('room-view')} className="text-xs text-slate-400 hover:text-white px-3 py-1.5 bg-slate-800 rounded-lg">
                                나가기
                            </button>
                        </div>

                        <div className="max-w-xl w-full mx-auto my-auto py-8">
                            {allPrayers.length === 0 ? (
                                <div className="text-center py-12">
                                    <p className="text-slate-500 text-sm">기도제목이 없습니다.</p>
                                </div>
                            ) : (
                                <div className="bg-slate-800 rounded-3xl p-8 border border-slate-700 shadow-2xl animate-fade-in">
                                    <div className="flex justify-between items-center mb-6">
                                        <span className="text-xs text-emerald-400 font-bold">
                                            {focusIndex + 1} / {allPrayers.length} 번째 기도제목
                                        </span>
                                        <span className="px-2.5 py-1 bg-slate-700 text-slate-300 text-xs rounded-lg">
                                            기간: {allPrayers[focusIndex]?.period}
                                        </span>
                                    </div>
                                    <h2 className="text-2xl font-bold mb-4 leading-snug">{allPrayers[focusIndex]?.name}</h2>
                                    <p className="text-slate-300 text-base leading-relaxed bg-slate-900/50 p-5 rounded-2xl border border-slate-700/50 whitespace-pre-wrap">
                                        {allPrayers[focusIndex]?.content || '내용이 없습니다.'}
                                    </p>
                                </div>
                            )}
                        </div>

                        <div className="max-w-xl w-full mx-auto flex justify-between items-center py-4">
                            <button 
                                onClick={() => setFocusIndex(prev => (prev > 0 ? prev - 1 : allPrayers.length - 1))}
                                className="px-5 py-3 bg-slate-800 hover:bg-slate-700 rounded-2xl text-sm font-semibold transition"
                            >
                                &larr; 이전 기도
                            </button>
                            <button 
                                onClick={() => setFocusIndex(prev => (prev < allPrayers.length - 1 ? prev + 1 : 0))}
                                className="px-5 py-3 bg-emerald-600 hover:bg-emerald-500 rounded-2xl text-sm font-semibold transition shadow-lg shadow-emerald-600/30"
                            >
                                다음 기도 &rarr;
                            </button>
                        </div>
                    </div>
                );
            }

            // 특정 방 내부 뷰 (교회 / 팀 / 개인 탭)
            const [activeTab, setActiveTab] = useState('church');

            return (
                <div className="min-h-full flex flex-col bg-slate-50">
                    {toast && (
                        <div className="fixed top-5 left-1/2 transform -translate-x-1/2 z-50 bg-slate-900/90 text-white px-5 py-3 rounded-2xl shadow-2xl text-sm font-medium animate-fade-in">
                            {toast}
                        </div>
                    )}

                    <header className="bg-white border-b border-slate-200 sticky top-0 z-30">
                        <div className="max-w-5xl mx-auto px-4 py-3.5 flex items-center justify-between">
                            <div className="flex items-center space-x-3">
                                <button onClick={() => setView('home')} className="text-xs text-slate-400 hover:text-slate-600 mr-1">
                                    &larr; 방 나가기
                                </button>
                                <div>
                                    <h1 className="font-bold text-slate-800">{currentRoom?.name}</h1>
                                    <p className="text-xs text-slate-500">접속자: {user.name} {isAdmin && <span className="text-emerald-600 font-bold">[관리자]</span>}</p>
                                </div>
                            </div>
                            <button 
                                onClick={() => { setFocusIndex(0); setView('focus-mode'); }}
                                className="px-3.5 py-2 bg-amber-500 text-white rounded-xl text-xs font-semibold shadow-md shadow-amber-500/20"
                            >
                                🙏 나의 기도 집중모드
                            </button>
                        </div>

                        {/* 탭 네비게이션 */}
                        <div className="max-w-5xl mx-auto px-4 flex space-x-2 border-t border-slate-100 py-2">
                            <button 
                                onClick={() => setActiveTab('church')}
                                className={`px-4 py-2 rounded-xl text-xs font-bold transition ${activeTab === 'church' ? 'bg-emerald-600 text-white' : 'text-slate-600 hover:bg-slate-100'}`}
                            >
                                ⛪ 교회 기도 ({churchPrayers.length})
                            </button>
                            <button 
                                onClick={() => setActiveTab('team')}
                                className={`px-4 py-2 rounded-xl text-xs font-bold transition ${activeTab === 'team' ? 'bg-emerald-600 text-white' : 'text-slate-600 hover:bg-slate-100'}`}
                            >
                                👥 팀 기도 ({teamPrayers.length})
                            </button>
                            <button 
                                onClick={() => setActiveTab('personal')}
                                className={`px-4 py-2 rounded-xl text-xs font-bold transition ${activeTab === 'personal' ? 'bg-emerald-600 text-white' : 'text-slate-600 hover:bg-slate-100'}`}
                            >
                                🔒 개인 기도 ({personalPrayers.length})
                            </button>
                        </div>
                    </header>

                    <main className="flex-1 max-w-5xl w-full mx-auto p-4 sm:p-6">
                        <div className="flex items-center justify-between mb-6">
                            <div>
                                <h2 className="text-xl font-bold text-slate-800">
                                    {activeTab === 'church' && '⛪ 교회 기도제목'}
                                    {activeTab === 'team' && '👥 팀 기도제목'}
                                    {activeTab === 'personal' && '🔒 개인 기도제목'}
                                </h2>
                                <p className="text-xs text-slate-500 mt-0.5">
                                    {activeTab === 'church' && (isAdmin ? '관리자 권한으로 교회 공용 기도제목을 작성할 수 있습니다.' : '관리자만 작성 가능한 공용 교회 기도제목입니다.')}
                                    {activeTab === 'team' && '기도팀 멤버들과 함께 나누는 공용 기도제목입니다.'}
                                    {activeTab === 'personal' && '나만 볼 수 있는 안전한 개인 기도보관함입니다.'}
                                </p>
                            </div>

                            {/* 교회 기도의 경우 관리자만 작성 가능, 그외는 누구나 가능 */}
                            {(activeTab !== 'church' || isAdmin) && (
                                <button 
                                    onClick={() => {
                                        setPrayerCategory(activeTab);
                                        resetPrayerForm();
                                        setPrayerModalOpen(true);
                                    }}
                                    className="px-4 py-2.5 bg-emerald-600 hover:bg-emerald-700 text-white rounded-xl text-xs font-semibold shadow-md shadow-emerald-600/20"
                                >
                                    + 기도제목 작성
                                </button>
                            )}
                        </div>

                        {/* 리스트 출력 */}
                        <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                            {((activeTab === 'church' ? churchPrayers : activeTab === 'team' ? teamPrayers : personalPrayers)).length === 0 ? (
                                <div className="col-span-full bg-white rounded-2xl p-12 text-center border border-slate-200">
                                    <p className="text-slate-400 text-sm">등록된 기도제목이 없습니다.</p>
                                </div>
                            ) : (
                                (activeTab === 'church' ? churchPrayers : activeTab === 'team' ? teamPrayers : personalPrayers).map(item => (
                                    <div key={item.id} className={`bg-white rounded-2xl p-5 border shadow-sm flex flex-col justify-between ${item.answered ? 'border-emerald-300 bg-emerald-50/20' : 'border-slate-200'}`}>
                                        <div>
                                            <div className="flex items-start justify-between gap-2 mb-2">
                                                <div>
                                                    <span className="px-2 py-0.5 bg-slate-100 text-slate-600 text-[10px] font-bold rounded mr-1">
                                                        {item.period}
                                                    </span>
                                                    {item.answered && <span className="px-2 py-0.5 bg-emerald-100 text-emerald-800 text-[10px] font-bold rounded">응답됨 ✨</span>}
                                                    <h3 className="font-bold text-slate-800 text-base mt-1">{item.name}</h3>
                                                </div>
                                                {(activeTab !== 'church' || isAdmin) && (
                                                    <div className="flex items-center space-x-1">
                                                        <button 
                                                            onClick={() => {
                                                                setPrayerCategory(activeTab);
                                                                setPrayerName(item.name);
                                                                setPrayerPeriod(item.period);
                                                                setPrayerContent(item.content);
                                                                setEditPrayerId(item.id);
                                                                setPrayerModalOpen(true);
                                                            }}
                                                            className="p-1 text-slate-400 hover:text-emerald-600 text-xs"
                                                        >
                                                            ✏️
                                                        </button>
                                                        <button 
                                                            onClick={() => handleDeletePrayer(activeTab, item.id)}
                                                            className="p-1 text-slate-400 hover:text-rose-600 text-xs"
                                                        >
                                                            🗑️
                                                        </button>
                                                    </div>
                                                )}
                                            </div>
                                            {item.content && (
                                                <p className="text-slate-600 text-sm mt-3 whitespace-pre-wrap leading-relaxed bg-slate-50 p-3 rounded-xl border border-slate-100">
                                                    {item.content}
                                                </p>
                                            )}
                                        </div>
                                        <div className="mt-4 pt-3 border-t border-slate-100 flex items-center justify-between">
                                            <span className="text-xs text-slate-400">작성: {item.author}</span>
                                            <button 
                                                onClick={() => handleToggleAnswer(activeTab, item.id)}
                                                className={`text-xs px-3 py-1 rounded-xl font-medium ${item.answered ? 'bg-emerald-600 text-white' : 'bg-slate-100 text-slate-600'}`}
                                            >
                                                {item.answered ? '응답 취소' : '응답 완료 체크'}
                                            </button>
                                        </div>
                                    </div>
                                ))
                            )}
                        </div>
                    </main>

                    {/* 기도제목 작성 모달 (기도이름, 기간, 내용) */}
                    {prayerModalOpen && (
                        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/60 backdrop-blur-xs animate-fade-in">
                            <div className="bg-white rounded-3xl max-w-md w-full p-6 sm:p-8 shadow-2xl border border-slate-100">
                                <h3 className="text-lg font-bold text-slate-800 mb-4">
                                    {editPrayerId ? '기도제목 수정' : '새 기도제목 작성'} ({prayerCategory === 'church' ? '교회' : prayerCategory === 'team' ? '팀' : '개인'})
                                </h3>

                                <form onSubmit={handleSavePrayer} className="space-y-4">
                                    <div>
                                        <label className="block text-xs font-semibold text-slate-600 uppercase mb-1">기도 이름 (제목)</label>
                                        <input 
                                            type="text" 
                                            value={prayerName}
                                            onChange={(e) => setPrayerName(e.target.value)}
                                            placeholder="예: 청년부 연합예배를 위하여"
                                            className="w-full px-4 py-2.5 rounded-xl border border-slate-200 text-sm focus:ring-2 focus:ring-emerald-500 focus:outline-none"
                                        />
                                    </div>

                                    <div>
                                        <label className="block text-xs font-semibold text-slate-600 uppercase mb-1">기도 기간</label>
                                        <input 
                                            type="text" 
                                            value={prayerPeriod}
                                            onChange={(e) => setPrayerPeriod(e.target.value)}
                                            placeholder="예: 2026년 3월 한 달간 / 매일 저녁"
                                            className="w-full px-4 py-2.5 rounded-xl border border-slate-200 text-sm focus:ring-2 focus:ring-emerald-500 focus:outline-none"
                                        />
                                    </div>

                                    <div>
                                        <label className="block text-xs font-semibold text-slate-600 uppercase mb-1">기도제목 내용</label>
                                        <textarea 
                                            rows="4"
                                            value={prayerContent}
                                            onChange={(e) => setPrayerContent(e.target.value)}
                                            placeholder="기도 내용을 상세히 적어주세요..."
                                            className="w-full px-4 py-2.5 rounded-xl border border-slate-200 text-sm focus:ring-2 focus:ring-emerald-500 focus:outline-none"
                                        ></textarea>
                                    </div>

                                    <div className="flex space-x-2 pt-2">
                                        <button 
                                            type="button"
                                            onClick={() => setPrayerModalOpen(false)}
                                            className="flex-1 py-3 bg-slate-100 hover:bg-slate-200 text-slate-700 font-semibold rounded-xl text-sm"
                                        >
                                            취소
                                        </button>
                                        <button 
                                            type="submit"
                                            className="flex-1 py-3 bg-emerald-600 hover:bg-emerald-700 text-white font-semibold rounded-xl text-sm shadow-md"
                                        >
                                            저장하기
                                        </button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
