 function startFocusSwipe(e){
   if(e.touches.length!==1){focusGestureRef.current=null;return;}
   focusGestureRef.current={x:e.touches[0].clientX,y:e.touches[0].clientY};
 }
 function endFocusSwipe(e){
   const start=focusGestureRef.current;
   focusGestureRef.current=null;
   if(!start||!e.changedTouches.length)return;
   const dx=e.changedTouches[0].clientX-start.x,dy=e.changedTouches[0].clientY-start.y;
   if(Math.abs(dx)<65||Math.abs(dx)<Math.abs(dy)*1.4)return;
   setFocus(i=>Math.max(0,Math.min(2,i+(dx<0?1:-1))));
 }

 </>:<><div className="section-head"><div><h2>기도방</h2><p>함께 기도할 팀을 만들고, 비밀번호로 참가할 수 있어요.</p></div><button className="primary" onClick={openRoom}>＋ 기도방 만들기</button></div>{rooms.length===0?<div className="empty"><div className="plant">🌳</div><h3>첫 번째 기도방을 만들어 보세요</h3><p>기도방 이름과 기간, 비밀번호를 정하고 팀원들과 기도제목을 나눠요.</p><button className="primary" onClick={openRoom}>기도방 만들기</button></div>:<div className="room-cards">{rooms.map(r=>{const owner=r.ownerId===me,inside=owner||members[r.id]||admin;return <article className="room-card" key={r.id}><div className="room-icon">🌿</div><h3>{r.name}</h3><p>{r.startDate||r.endDate?"기도 기간 : "+(fmt(r.startDate)||"시작일 미정")+" ~ "+(fmt(r.endDate)||"종료일 미정"):"기간 제한 없는 기도방"}<br/>팀장 : {r.ownerName||"기도팀장"}</p><div className="room-row"><span className={"room-badge "+(inside?"":"lock")}>{owner?"👑 내가 만든 방":admin?"👑 관리자":inside?"✓ 참가 중":"🔒 비밀번호 필요"}</span>{!inside?<button className="primary" onClick={()=>openJoin(r)}>기도방 참가하기</button>:<button className="outline" onClick={()=>{setSection("team");openPrayer("team",r.id);}}>＋ 팀 기도 작성</button>}{inside&&!owner&&<button className="tiny-btn" onClick={()=>leaveRoom(r.id)}>탈퇴</button>}{owner&&<button className="tiny-btn" onClick={()=>setShowMemberRoom(showMemberRoom===r.id?"":r.id)}>팀원 관리</button>}</div>{owner&&showMemberRoom===r.id&&<div className="members"><strong style={{fontSize:12}}>팀원 목록 ({(ownerMembers[r.id]||[]).length}명)</strong>{(ownerMembers[r.id]||[]).map(m=><div className="member" key={m.id}><span>{m.displayName||"팀원"}</span><button className="tiny-btn" onClick={()=>kick(r.id,m.id)}>가입 해지</button></div>)}{!(ownerMembers[r.id]||[]).length&&<p>가입한 팀원이 없습니다.</p>}<button className="outline danger" style={{marginTop:10,fontSize:12}} onClick={()=>closeRoom(r)}>기도방 종료</button></div>}</article>;})}</div>}</>}
 </main></div></div>

 <div className="field-row"><div className="field"><label>시작일</label><input type="date" value={draft.startDate||""} onChange={e=>setDraft(d=>({...d,startDate:e.target.value}))}/></div><div className="field"><label>종료일</label><input type="date" value={draft.endDate||""} onChange={e=>setDraft(d=>({...d,endDate:e.target.value}))}/></div></div>

 {focus>=0&&activeAll.length>0&&<div className="focus-screen" role="dialog" aria-modal="true" aria-label="기도의 시간">

   <div className="focus-bottom">

   </div>
 </div>}
