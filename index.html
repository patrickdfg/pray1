   <div className="stat"><div className="progress-ring" style={{background:"conic-gradient(#87a8ef "+(allTeam.length?Math.round(allTeam.filter(p=>isChecked(p,today)).length/allTeam.length*100):0)+"%,#e5edf9 0)"}}><div className="progress-ring-inner"><strong>{allTeam.filter(p=>isChecked(p,today)).length}/{allTeam.length}</strong><span>완료</span></div></div><span className="mini">팀 기도</span><p>함께하는 기도</p></div>
   <div className="stat"><div className="progress-ring" style={{background:"conic-gradient(#f0c277 "+(personal.length?Math.round(personal.filter(p=>isChecked(p,today)).length/personal.length*100):0)+"%,#f6ecdb 0)"}}><div className="progress-ring-inner"><strong>{personal.filter(p=>isChecked(p,today)).length}/{personal.length}</strong><span>완료</span></div></div><span className="mini">개인 기도</span><p>나만의 기도</p></div>
  </div>
 </div>
 <MoonMiniCalendar today={today} checks={month===today.slice(0,7)?monthChecks:[]} onChoose={day=>{setMonth(day.slice(0,7));setSelectedDay(day);setSection("calendar");}} onOpen={()=>{setMonth(today.slice(0,7));setSelectedDay(today);setSection("calendar");}}/>
 </div>}
 {section==="all"&&<div className="tabs">{[["all","전체 "+all.length],["church","교회"],["team","기도팀"],["personal","개인"]].map(([id,label])=><button key={id} className={"chip "+(filter===id?"active":"")} onClick={()=>setFilter(id)}>{label}</button>)}</div>}
 {section==="team"&&<div className="tabs">{joined.length?joined.map(r=><button className="chip" key={r.id} onClick={()=>openPrayer("team",r.id)}>＋ {r.name} 기도 작성</button>):<button className="chip" onClick={()=>setSection("rooms")}>기도방 참가하기 →</button>}</div>}
 <div className="cards">{shown.length?shown.map(p=><Card key={p.kind+":"+p.roomId+":"+p.id} p={p}/>):<div className="empty"><div className="plant">🌱</div><h3>아직 심어진 기도제목이 없어요</h3><p>{section==="church"&&!admin?"교회 관리자가 기도제목을 등록하면 이곳에 표시됩니다.":section==="team"?"기도방에 참가하거나 팀 기도를 등록해 보세요.":"첫 번째 기도제목을 작성해 보세요."}</p>{section==="team"?<button className="primary" onClick={()=>setSection("rooms")}>기도방 살펴보기</button>:(section==="all"||section==="personal")?<button className="primary" onClick={()=>openPrayer(section==="all"?"team":"personal")}>＋ {section==="all"?"팀 기도":"개인 기도"} 등록</button>:admin?<button className="primary" onClick={()=>openPrayer("church")}>＋ 교회 기도 등록</button>:null}</div>}</div>
 </>:<><div className="section-head"><div><h2>기도방</h2><p>함께 기도할 팀을 만들고, 비밀번호로 참가할 수 있어요.</p></div><button className="primary" onClick={openRoom}>＋ 기도방 만들기</button></div>{rooms.length===0?<div className="empty"><div className="plant">🌳</div><h3>첫 번째 기도방을 만들어 보세요</h3><p>기도방 이름과 기간, 비밀번호를 정하고 팀원들과 기도제목을 나눠요.</p><button className="primary" onClick={openRoom}>기도방 만들기</button></div>:<div className="room-cards">{rooms.map(r=>{const owner=r.ownerId===me,inside=owner||members[r.id];return <article className="room-card" key={r.id}><div className="room-icon">🌿</div><h3>{r.name}</h3><p>{r.startDate||r.endDate?"기도 기간 : "+(fmt(r.startDate)||"시작일 미정")+" ~ "+(fmt(r.endDate)||"종료일 미정"):"기간 제한 없는 기도방"}<br/>팀장 : {r.ownerName||"기도팀장"}</p><div className="room-row"><span className={"room-badge "+(inside?"":"lock")}>{owner?"👑 내가 만든 방":inside?"✓ 참가 중":"🔒 비밀번호 필요"}</span>{!inside?<button className="primary" onClick={()=>openJoin(r)}>기도방 참가하기</button>:<button className="outline" onClick={()=>{setSection("team");openPrayer("team",r.id);}}>＋ 팀 기도 작성</button>}{inside&&!owner&&<button className="tiny-btn" onClick={()=>leaveRoom(r.id)}>탈퇴</button>}{owner&&<button className="tiny-btn" onClick={()=>setShowMemberRoom(showMemberRoom===r.id?"":r.id)}>팀원 관리</button>}</div>{owner&&showMemberRoom===r.id&&<div className="members"><strong style={{fontSize:12}}>팀원 목록 ({(ownerMembers[r.id]||[]).length}명)</strong>{(ownerMembers[r.id]||[]).map(m=><div className="member" key={m.id}><span>{m.displayName||"팀원"}</span><button className="tiny-btn" onClick={()=>kick(r.id,m.id)}>가입 해지</button></div>)}{!(ownerMembers[r.id]||[]).length&&<p>가입한 팀원이 없습니다.</p>}<button className="outline danger" style={{marginTop:10,fontSize:12}} onClick={()=>closeRoom(r)}>기도방 종료</button></div>}</article>;})}</div>}<div className="notice">🔐 기도방 비밀번호는 8자 이상으로 설정해 주세요. 비밀번호를 아는 사람도 Google 로그인 후 참가해야 합니다.</div></>}
 </main></div></div>
 {modal&&<div className="modal-bg" onMouseDown={e=>{if(e.target===e.currentTarget&&!busy)setModal(null);}}><div className="modal"><div className="modal-head"><h2>{modal==="room"?"🌳 기도방 만들기":modal==="join"?"🔒 기도방 참가하기":draft.id?"✏️ 기도제목 수정":draft.kind==="team"?"🤝 팀 기도제목 등록":draft.kind==="church"?"⛪ 교회 기도제목 등록":"🌷 개인 기도 등록"}</h2><button className="x" onClick={()=>setModal(null)} aria-label="닫기">×</button></div>
 {modal==="prayer"?<form onSubmit={savePrayer}><div className="field"><label>기도 종류</label><select value={draft.kind||"team"} disabled={!!draft.id} onChange={e=>setDraft(d=>({...d,kind:e.target.value,roomId:joined[0]?.id||""}))}>{joined.length>0&&<option value="team">🤝 팀 기도</option>}<option value="personal">🌷 개인 기도</option>{admin&&<option value="church">⛪ 교회 기도</option>}</select></div>{draft.kind==="team"&&<div className="field"><label>기도팀 선택</label><select value={draft.roomId||""} disabled={!!draft.id} required onChange={e=>setDraft(d=>({...d,roomId:e.target.value}))}>{joined.map(r=><option key={r.id} value={r.id}>{r.name}</option>)}</select></div>}
 <div className="field"><label>기도명 *</label><input required maxLength="100" placeholder="예: 가정의 평안과 건강" value={draft.title||""} onChange={e=>setDraft(d=>({...d,title:e.target.value}))}/></div>
 <div className="field-row"><div className="field"><label>시작일</label><input type="date" value={draft.startDate||""} onChange={e=>setDraft(d=>({...d,startDate:e.target.value}))}/></div><div className="field"><label>종료일</label><input type="date" value={draft.endDate||""} onChange={e=>setDraft(d=>({...d,endDate:e.target.value}))}/></div></div>
 <div className="field"><label>기도제목 *</label><textarea required maxLength="5000" placeholder="기도할 내용을 편안하게 적어주세요." value={draft.content||""} onChange={e=>setDraft(d=>({...d,content:e.target.value}))}/></div><div className="modal-actions"><button type="button" className="outline" onClick={()=>setModal(null)}>취소</button><button className="primary" disabled={busy}>{busy?"저장 중…":"저장하기"}</button></div></form>
 :modal==="room"?<form onSubmit={createRoom}><div className="field"><label>기도방 이름 *</label><input required maxLength="80" placeholder="예: 절대 믿음 40일 기도팀" value={draft.name||""} onChange={e=>setDraft(d=>({...d,name:e.target.value}))}/></div><div className="field-row"><div className="field"><label>기도 시작일</label><input type="date" value={draft.startDate||""} onChange={e=>setDraft(d=>({...d,startDate:e.target.value}))}/></div><div className="field"><label>기도 종료일</label><input type="date" value={draft.endDate||""} onChange={e=>setDraft(d=>({...d,endDate:e.target.value}))}/></div></div><div className="field"><label>참가 비밀번호 * (8자 이상)</label><input required minLength="8" maxLength="64" autoComplete="off" type="password" placeholder="팀원에게 전달할 비밀번호" value={draft.code||""} onChange={e=>setDraft(d=>({...d,code:e.target.value}))}/><span className="form-help">참가 비밀번호는 기도방 공개 목록에 표시되지 않습니다.</span></div><div className="field"><label>첫 번째 기도명 (선택)</label><input maxLength="100" placeholder="예: 우리 팀의 기도제목" value={draft.initialTitle||""} onChange={e=>setDraft(d=>({...d,initialTitle:e.target.value}))}/></div><div className="field"><label>첫 번째 기도제목 (선택)</label><textarea placeholder="첫 기도제목을 함께 등록할 수 있어요." value={draft.initialContent||""} onChange={e=>setDraft(d=>({...d,initialContent:e.target.value}))}/></div><div className="modal-actions"><button className="outline" type="button" onClick={()=>setModal(null)}>취소</button><button className="primary" disabled={busy}>{busy?"만드는 중…":"기도방 만들기"}</button></div></form>
 :<form onSubmit={joinRoom}><p style={{fontSize:14,color:"#687b6d",lineHeight:1.8}}><strong>{draft.roomName}</strong>에 참가하시려면 팀장이 알려준 비밀번호를 입력하세요.</p><div className="field"><label>기도방 비밀번호</label><input required type="password" autoComplete="off" placeholder="참가 비밀번호 입력" value={draft.code||""} onChange={e=>setDraft(d=>({...d,code:e.target.value}))}/></div><div className="modal-actions"><button type="button" className="outline" onClick={()=>setModal(null)}>취소</button><button className="primary" disabled={busy}>{busy?"확인 중…":"기도방 참가하기"}</button></div></form>}</div></div>}
 {focus>=0&&all.length>0&&<div className="focus-screen"><div className="focus-head"><strong>🌿 기도의 시간</strong><button className="primary light" onClick={()=>setFocus(-1)}>✕ 마치기</button></div><div className="focus-center"><div className="circle">🙏</div><span className="counter">{focus+1} / {all.length}</span><h2>{all[Math.min(focus,all.length-1)].title}</h2><span className="tag">{all[Math.min(focus,all.length-1)].kind==="church"?"교회 기도":all[Math.min(focus,all.length-1)].kind==="team"?"팀 기도":"개인 기도"}</span><p>{all[Math.min(focus,all.length-1)].content}</p><div className="focus-controls"><button className="outline" disabled={focus===0} onClick={()=>setFocus(i=>Math.max(0,i-1))}>← 이전 제목</button><button className="primary light" style={{background:isChecked(all[Math.min(focus,all.length-1)],today)?"#d0ecd9":"#fff8dc"}} onClick={()=>togglePrayer(all[Math.min(focus,all.length-1)],today)} disabled={pendingCheck===checkId(all[Math.min(focus,all.length-1)],today)}>{isChecked(all[Math.min(focus,all.length-1)],today)?"✓ 오늘 기도했어요":"🙏 기도했어요"}</button><button className="primary light" disabled={focus>=all.length-1} onClick={()=>setFocus(i=>Math.min(all.length-1,i+1))}>다음 제목 →</button></div></div><div className="focus-bottom">잠시 멈추어 기도의 내용에 마음을 모아보세요.</div></div>}
 {toast&&<div className="toast" role="status">{toast}</div>}</>;
}
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body></html>
